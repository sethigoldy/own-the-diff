name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.9'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.13'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - name: Install and run the packaged demo outside the checkout
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          export COR_HOME="$RUNNER_TEMP/cor-demo"
          cor demo
          cor inventory --session "Retry failed jobs"

  web:
    name: Browser build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check that the shipped UI matches the source
        run: |
          if [ -n "$(git status --porcelain -- ../cor/static/)" ]; then
            git status --short -- ../cor/static/
            exit 1
          fi
