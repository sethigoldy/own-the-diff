name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.9'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.13'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - name: Install and run the packaged demo outside the checkout
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          export COR_HOME="$RUNNER_TEMP/cor-demo"
          cor demo
          cor inventory --session "Retry failed jobs"

  web:
    name: Browser build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check that the shipped UI matches the source
        run: |
          if [ -n "$(git status --porcelain -- ../cor/static/)" ]; then
            git status --short -- ../cor/static/
            exit 1
          fi
